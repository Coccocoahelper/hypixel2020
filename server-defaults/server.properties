#Copied to run/server.properties on first start by start-server.bat / start-server.sh.
#Offline mode so the bots and local test accounts can join. Keep the server on your own machine / LAN.
online-mode=false
server-port=25565
max-players=200
motd=Hypixel Network  [1.8-1.16]
level-name=world
level-type=FLAT
generate-structures=false
allow-nether=false
spawn-protection=0
view-distance=8
difficulty=1
pvp=true
announce-player-achievements=false
snooper-enabled=false
player-idle-timeout=0
enable-command-block=false
#RCON is used by scripts/rcon.py. The start script replaces the password below with a random one.
enable-rcon=true
rcon.port=25575
rcon.password=CHANGE_ME
broadcast-rcon-to-ops=false
